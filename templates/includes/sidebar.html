<div class="col-lg-4">
    <div class="sidebar">
        <div class="row">

            <!-- Search -->
            <div class="col-lg-8">
                <div class="sidebar-item search">
                    <form id="search_form" name="gs" method="GET" action="{% url "blog:search_articles" %}">
                        <input type="text" name="q" class="searchText" placeholder="type to search..."
                               autocomplete="on">
                    </form>
                </div>
            </div>

            <!-- Recent Posts -->
            <div class="col-lg-12">
                <div class="sidebar-item recent-posts">
                    <div class="sidebar-heading">
                        <h2>Recent Posts</h2>
                    </div>
                    <div class="content">
                        <ul>
                            {% for article in recent_articles %}
                                <li>
                                    <a href="{% url 'blog:article_detail' article.slug %}">
                                        <h5>{{ article.title }}</h5>
                                        <span>{{ article.created }}</span>
                                    </a>
                                </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="col-lg-12">
                <div class="sidebar-item categories">
                    <div class="sidebar-heading">
                        <h2>Categories</h2>
                    </div>
                    <div class="content">
                        <ul>
                            {% for cat in categories %}
                                <li>
                                    <a href="{% url 'blog:category_detail' cat.id %}">- {{ cat.title }}</a>
                                </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
